# merge: reuse other objects in the same file as templates (multiple sources, deep merge)
templates:
  http:
    timeout: 30
    retry: 3
    headers: { Accept: application/json }
  auth: { type: bearer, required: true }

clients:
  public:
    merge: ${this.templates.http}
    timeout: 10
  private:
    # ${...} inside a YAML flow sequence must be quoted, otherwise { starts a mapping
    merge: ["${this.templates.http}", "${this.templates.auth}"]
    retry: 5
