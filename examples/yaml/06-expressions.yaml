# this: in-file reference (resolved at load time, references can chain)
storage:
  root: /data
  daily: ${this.storage.root}/daily
  archive: ${this.storage.daily}/archive

# calc: restricted arithmetic (must be quoted in YAML so ": " is not read as a mapping separator)
limits:
  timeout: 3
  retry: 4
  total: "%{calc: ${this.limits.timeout} * ${this.limits.retry} }"

token: "${EXPRESSIONS_TOKEN:dev-token}"
