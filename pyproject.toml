[project]
name = "darwin-config"
version = "0.2.0"
description = "Layered, recursive configuration loader for JSON and YAML with variables, refs and schema validation"
readme = "README.md"
authors = [
    { name = "Hong", email = "sardineclub@126.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=7.0"]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
