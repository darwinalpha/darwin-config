[project]
name = "darwin-config"
version = "0.3.2"
description = "Layered, recursive configuration loader for JSON, YAML and TOML with variables, refs and schema validation"
readme = "README.md"
authors = [
    { name = "Hong", email = "sardineclub@126.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
"Chinese Documentation" = "https://github.com/darwinalpha/darwin-config/blob/main/README.cn.md"

[project.optional-dependencies]
# Formats: reading JSON/TOML is built in; these extras add YAML and TOML writing.
yaml = ["PyYAML>=6.0"]
toml = ["tomli-w>=1.0"]
all = ["PyYAML>=6.0", "tomli-w>=1.0"]
# L1 framework adapters (kept separate so the core stays dependency-free).
flask = ["Flask>=3.0"]
django = ["Django>=5.0"]
pydantic = ["pydantic>=2.0"]
test = ["pytest>=7.0"]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
